<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Flashcard Quiz App</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #222;
            min-height: 100vh;
        }


        .container {
            width: 90%;
            max-width: 700px;
            margin: 40px auto;
        }


        h1 {
            text-align: center;
            color: #2563eb;
            margin-bottom: 10px;
        }


        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }


        .card {
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
            text-align: center;
            margin-bottom: 20px;
        }


        .counter {
            color: #777;
            margin-bottom: 20px;
        }


        #question {
            font-size: 25px;
            margin-bottom: 20px;
        }


        #answer {
            display: none;
            background: #eaf2ff;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            color: #1e40af;
        }


        button {
            border: none;
            padding: 11px 18px;
            margin: 5px;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }


        button:hover {
            background: #1d4ed8;
        }


        .delete {
            background: #dc2626;
        }


        .delete:hover {
            background: #b91c1c;
        }


        .form {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }


        .form h2 {
            margin-bottom: 15px;
        }


        input,
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }


        textarea {
            height: 100px;
            resize: vertical;
        }


        @media(max-width:600px) {

            .container {
                width: 95%;
                margin: 20px auto;
            }

            .card {
                padding: 25px 15px;
            }

            #question {
                font-size: 20px;
            }

        }

    </style>

</head>


<body>


<div class="container">

    <h1>📚 Flashcard Quiz App</h1>

    <p class="subtitle">
        Study, Review and Customize Your Flashcards
    </p>


    <!-- Flashcard -->

    <div class="card">

        <div class="counter" id="counter">
            Card 1 of 3
        </div>


        <h2 id="question"></h2>


        <div id="answer"></div>


        <button onclick="previousCard()">
            Previous
        </button>


        <button onclick="showAnswer()">
            Show Answer
        </button>


        <button onclick="nextCard()">
            Next
        </button>

        <br>


        <button onclick="editCard()">
            Edit
        </button>


        <button class="delete"
                onclick="deleteCard()">
            Delete
        </button>

    </div>



    <!-- Add Flashcard -->

    <div class="form">

        <h2>Add / Edit Flashcard</h2>


        <input
            type="text"
            id="questionInput"
            placeholder="Enter your question"
        >


        <textarea
            id="answerInput"
            placeholder="Enter your answer"
        ></textarea>


        <button onclick="saveCard()">
            Save Card
        </button>


        <button onclick="clearForm()">
            Clear
        </button>

    </div>

</div>



<script>


    // Default flashcards

    let cards = [

        {
            question: "What is HTML?",
            answer: "HTML stands for HyperText Markup Language."
        },

        {
            question: "What is CSS?",
            answer: "CSS is used to style web pages."
        },

        {
            question: "What is JavaScript?",
            answer: "JavaScript is used to add functionality to web pages."
        }

    ];


    let currentCard = 0;

    let editing = false;



    // Display card

    function displayCard() {

        if (cards.length === 0) {

            document.getElementById("question").innerText =
                "No flashcards available";

            document.getElementById("answer").style.display =
                "none";

            document.getElementById("counter").innerText =
                "0 cards";

            return;
        }


        document.getElementById("question").innerText =
            cards[currentCard].question;


        document.getElementById("answer").innerText =
            cards[currentCard].answer;


        document.getElementById("answer").style.display =
            "none";


        document.getElementById("counter").innerText =
            "Card " +
            (currentCard + 1) +
            " of " +
            cards.length;

    }



    // Show answer

    function showAnswer() {

        document.getElementById("answer").style.display =
            "block";

    }



    // Next card

    function nextCard() {

        if (cards.length === 0) {
            return;
        }


        currentCard++;


        if (currentCard >= cards.length) {
            currentCard = 0;
        }


        displayCard();

    }



    // Previous card

    function previousCard() {

        if (cards.length === 0) {
            return;
        }


        currentCard--;


        if (currentCard < 0) {
            currentCard = cards.length - 1;
        }


        displayCard();

    }



    // Add or edit card

    function saveCard() {

        let question =
            document.getElementById("questionInput").value.trim();


        let answer =
            document.getElementById("answerInput").value.trim();


        if (question === "" || answer === "") {

            alert("Please enter both question and answer.");

            return;
        }


        if (editing) {

            cards[currentCard].question =
                question;

            cards[currentCard].answer =
                answer;

            editing = false;

        }

        else {

            cards.push({

                question: question,

                answer: answer

            });


            currentCard =
                cards.length - 1;

        }


        clearForm();

        displayCard();

    }



    // Edit card

    function editCard() {

        if (cards.length === 0) {
            return;
        }


        document.getElementById("questionInput").value =
            cards[currentCard].question;


        document.getElementById("answerInput").value =
            cards[currentCard].answer;


        editing = true;

    }



    // Delete card

    function deleteCard() {

        if (cards.length === 0) {
            return;
        }


        let confirmDelete =
            confirm("Do you want to delete this flashcard?");


        if (!confirmDelete) {
            return;
        }


        cards.splice(currentCard, 1);


        if (currentCard >= cards.length) {
            currentCard = cards.length - 1;
        }


        displayCard();

    }



    // Clear form

    function clearForm() {

        document.getElementById("questionInput").value =
            "";

        document.getElementById("answerInput").value =
            "";

        editing = false;

    }



    // Start application

    displayCard();


</script>


</body>

</html>
